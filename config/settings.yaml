# Values support ${ENV} and ${ENV:-default}.
# Secrets must come from environment variables (.env) — literal API keys here are rejected.

llm:
  provider: ${LLM_PROVIDER:-openai}          # openai | mock
  api_key: ${OPENAI_API_KEY:-}
  chat_model: ${CHAT_MODEL:-gpt-4.1-mini}
  extract_model: ${EXTRACT_MODEL:-gpt-4.1-mini}
  asr_model: ${ASR_MODEL:-gpt-4o-transcribe}
  # Without a hint, Mandarin is often transcribed in Traditional characters. Keep this a
  # description nobody would say aloud: on near-silent clips the model can echo it back,
  # and echoes are detected and discarded (see OpenAIClient.transcribe).
  asr_prompt: "以下是一段简体中文或英文的日常聊天录音转写。Transcript of a casual chat in English or Simplified Chinese."
  tts_model: ${TTS_MODEL:-gpt-4o-mini-tts}
  tts_voice: ${TTS_VOICE:-coral}
  tts_voices:                                # the elder app's voice switch
    female: ${TTS_VOICE_FEMALE:-coral}
    male: ${TTS_VOICE_MALE:-ash}
  tts_instructions: "Speak slowly, warmly and clearly, like a caring family member."
  vision_model: ${VISION_MODEL:-gpt-4.1-mini}
  timeout_s: 15

chat:
  companion_name: ${COMPANION_NAME:-Sunny}
  timezone: ${ELDER_TIMEZONE:-America/Los_Angeles}   # elder's local time for greetings / "yesterday"
  history_turns: 10                                  # turns = user+assistant pairs kept in context
  max_reply_tokens: 150
  follow_up_hours: 48                                # unresolved symptoms this recent get a gentle follow-up

symptoms:
  merge_window_hours: 24
  alert_debounce_hours: 2

memory:
  care_list_min_mentions: 2          # people/topics mentioned this often appear on the care list
  follow_up_default_delay_days: 1    # "I'll repot the orchid" with no date -> ask tomorrow
  follow_up_expire_days: 7           # follow-ups never asked this long after they were due are dropped

agenda:
  max_items_per_greet: 3             # follow-ups carried by one greeting; the rest wait

privacy:
  max_span_user_messages: 3          # preceding user messages a privacy request can cover
  bypass_levels: [high]              # alert levels that ignore privacy marks — do not change without an ADR
  ask_before_sharing: ${ASK_BEFORE_SHARING:-true}   # symptoms / personal matters wait for her OK (red flags never wait)

fall:
  model: ${FALL_MODEL:-models/yolo11n-pose.pt}   # fetched by scripts/fetch_demo_media.py
  device: ${FALL_DEVICE:-cpu}                    # cpu | mps (Apple Silicon) | 0 (CUDA)
  min_keypoint_conf: 0.3                         # keypoints below this are ignored
  aspect_ratio_threshold: 1.2                    # bbox width / height above this = lying
  torso_angle_deg: 60                            # torso this far from vertical = lying
  drop_ratio: 0.25                               # hip drop, as a fraction of standing height ...
  drop_window_s: 0.6                             # ... within this long = a fall, not lying down
  down_confirm_s: 3                              # on the floor this long => alert
  cooldown_s: 30                                 # no repeat alert for the same person
  vision_verify: false
  report_url: ${FALL_REPORT_URL:-http://127.0.0.1:8000/api/alerts}
  mcp:
    host: 127.0.0.1
    port: 8001
    events_path: data/fall_events.jsonl
    snapshots_dir: data/snapshots
    autostart_source: ${FALL_SOURCE:-demo/videos/walk.mp4}   # looped on launch; empty = wait for start_monitoring

database:
  url: ${DATABASE_URL:-sqlite:///data/app.db}   # relative sqlite paths resolve against the project root

server:
  host: ${HOST:-127.0.0.1}
  port: ${PORT:-8000}

paths:
  data_dir: ${DATA_DIR:-data}                    # audio/ and snapshots/ live under here
