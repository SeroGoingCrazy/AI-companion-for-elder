# Canned responses for LLM_PROVIDER=mock (offline tests + demo fallback when the network is down).
# chat rules match case-insensitive substrings of the latest user message; first match wins.
# Keep the demo-script lines (DEV_SPEC "Demo Script") covered here so the demo can replay offline.

chat:
  greet: "Good morning, Maggie! How is that knee feeling today?"   # one question: tidy_reply keeps only the first
  # Matched against the greeting instruction (session agenda, first-chat disclosure).
  greet_rules:
    # Chinese first: the greeting instruction says "in Chinese" when her app is set to it,
    # and these rules are matched in order, so the Chinese pair has to come before the
    # English one it would otherwise fall through to.
    - match_all: ["first chat together", "in Chinese"]
      reply: "早上好，Maggie！我是 Hallo。有件事先跟你说清楚：任何私人的事，我都会先问过你才告诉 Amy；你想留在咱俩之间的，就留在咱俩之间。只有一种例外，就是你的安全，比如摔倒或者胸口疼，那种我一定会告诉 Amy。你今天感觉怎么样？"
    - match: ["in Chinese"]
      reply: "早上好，Maggie！膝盖今天还疼吗？"
    - match: ["first chat together"]
      reply: "Good morning, Maggie! I'm Hallo. I'll always ask you before I tell Amy anything personal, and what you want kept between us stays there, except your safety, like a fall or chest pain, which I'd always tell Amy about. How are you feeling today?"
    # Reminders outrank follow-ups in the agenda, so this rule comes before the orchid one.
    - match: ["asked you to check on this"]
      reply: "Good morning, Maggie! Amy asked me to check in about your blood pressure pill with breakfast. Have you had it yet?"
    - match: ["orchid"]
      reply: "Good morning, Maggie! How did repotting your orchid go?"
  default: "That's lovely to hear, Maggie. Tell me a little more?"
  default_zh: "嗯嗯，我在听呢。能再多跟我说说吗？"
  # Matched against the system prompt, before `rules`.
  system_rules:
    - match: ["opening paragraph of a weekly report"]
      reply: "Maggie had a mixed week: a rough patch mid-week with a bad knee day and two nights of poor sleep, then a real lift over the weekend. Her knee came up on four of the seven days and is the thing most worth watching. She took her blood pressure pill on most of the days it was raised."
    - match: ["keepsake memoir"]
      reply: "This is one of the stories I love to tell, and I'm glad my family will keep it."
  rules:
    # Her answer to "would you like me to let Amy know?" (json.share_consent matches the same words).
    - match: ["yes, you can tell", "yes, please tell", "go ahead and tell"]
      reply: "Okay, I'll let Amy know. Thank you for telling me."
    - match: ["可以，告诉", "告诉她吧"]
      reply: "好的，我会跟Amy说一声。谢谢你告诉我。"
    - match: ["不要告诉", "先别说", "别跟"]
      reply: "好，我不说出去。你什么时候想聊，我都在。"
    - match: ["no, don't tell"]
      reply: "Of course, I'll keep it to myself. I'm here whenever you want to talk about it."
    - match: ["别告诉", "咱俩之间", "保密"]
      reply: "好，这事就咱俩知道。不过有一点先说清楚：要是关系到你的安全，比如摔倒或者胸口疼，我还是会告诉 Amy。"
    - match: ["between us"]
      reply: "Of course, this stays between us. Just so you know, if it's ever about your safety, like a fall or chest pain, I'll always let Amy know."
    - match: ["胸口", "喘不", "透不过气", "心口"]
      reply: "Maggie，这个可不能等。请马上打 120，然后给 Amy 打电话。我一直在这儿陪着你。"
    - match: ["chest", "can't breathe", "can't catch my breath"]
      reply: "Maggie, that could be serious. Please call 911 right now, and then call Amy. I'm right here with you."
    - match: ["头晕", "头有点晕"]
      reply: "头晕可要当心，听着就不好受。要不要我跟Amy说一声你这两天头晕？"
    - match: ["dizzy", "dizziness"]
      reply: "I'm sorry you're feeling dizzy. Does it happen mostly when you stand up, or all day long?"
    - match: ["睡", "失眠"]
      reply: "没睡好可真难受。要不要我跟 Amy 说一声，你这几天睡得不太好？"
    - match: ["sleep", "slept"]
      reply: "Oh no, a rough night is no fun. Would you like me to let Amy know you haven't been sleeping well?"
    - match: ["膝盖", "腿疼"]
      reply: "膝盖好些了我就放心了。今天打算去院子里走走吗？"
    - match: ["knee"]
      reply: "I'm glad the knee is doing better. Will you get out to the garden today?"
    - match: ["吃过了", "吃了", "已经吃"]
      reply: "那就好。今天上午还有什么安排吗？"
    - match: ["took it", "already took"]
      reply: "That's good to hear, Maggie. What's the plan for the rest of your morning?"
    - match: ["还没", "没吃"]
      reply: "不着急。要不我过会儿再问问你？"
    - match: ["not yet"]
      reply: "No rush at all. Shall I check in with you again a bit later?"
    - match: ["孤单", "一个人", "寂寞"]
      reply: "我在这儿陪着你呢，Maggie。想跟我说说今天的事吗？或者，待会儿给 Leo 打个电话？"
    - match: ["lonely", "alone"]
      reply: "I'm right here with you, Maggie. Would you like to tell me about your day, or maybe give Leo a call later?"

# Structured-output responses keyed by schema name; rules match the latest user message.
# symptom_extraction: raw_quote must be a substring of the utterance or the extractor drops it,
# so quotes here are the shortest keyword that the rule matches on. Rules that match either
# language list one entry per language; the one whose quote is absent gets dropped.
json:
  # Ask-before-sharing (consent.py). Empty `subjects` = her answer to the latest question.
  share_consent:
    default: {personal_topics: [], answer: {decision: none, subjects: []}}
    rules:
      - match: ["yes, you can tell", "yes, please tell", "go ahead and tell", "可以，告诉", "告诉她吧"]
        result: {personal_topics: [], answer: {decision: share, subjects: []}}
      - match: ["no, don't tell", "不要告诉", "先别说"]
        result: {personal_topics: [], answer: {decision: keep_private, subjects: []}}
      - match: ["money"]
        result:
          personal_topics: [{subject: money worries, raw_quote: money}]
          answer: {decision: none, subjects: []}
  # No echo offline: an empty result makes redaction.py fall back to its rule-based pass.
  family_redaction:
    default: {messages: []}
  symptom_extraction:
    default: {symptoms: []}
    rules:
      - match: ["胸口", "喘不"]
        result:
          symptoms:
            - {canonical: chest_pain, label: 胸口闷, body_part: chest, severity: unknown,
               duration: null, onset: null, status: new, raw_quote: 胸口}
            - {canonical: shortness_of_breath, label: 喘不上气, body_part: null, severity: unknown,
               duration: null, onset: null, status: new, raw_quote: 喘不}
      - match: ["chest", "catch my breath"]
        result:
          symptoms:
            - {canonical: chest_pain, label: chest tightness, body_part: chest, severity: unknown,
               duration: null, onset: null, status: new, raw_quote: chest}
            - {canonical: shortness_of_breath, label: can't catch breath, body_part: null,
               severity: unknown, duration: null, onset: null, status: new,
               raw_quote: catch my breath}
      - match: ["头有点晕"]
        result:
          symptoms:
            - {canonical: dizziness, label: 早上起床头晕, body_part: head, severity: mild,
               duration: 2 days, onset: mornings, status: new, raw_quote: 头有点晕}
      - match: ["头晕"]
        result:
          symptoms:
            - {canonical: dizziness, label: 头晕, body_part: head, severity: unknown,
               duration: null, onset: null, status: new, raw_quote: 头晕}
      - match: ["dizzy"]
        result:
          symptoms:
            - {canonical: dizziness, label: dizziness, body_part: head, severity: unknown,
               duration: null, onset: null, status: new, raw_quote: dizzy}
      - match: ["fell", "摔"]
        result:
          symptoms:
            - {canonical: fall, label: fall, body_part: null, severity: unknown,
               duration: null, onset: null, status: new, raw_quote: fell}
            - {canonical: fall, label: 摔倒, body_part: null, severity: unknown,
               duration: null, onset: null, status: new, raw_quote: 摔}
      - match: ["sleep well", "没睡好"]
        result:
          symptoms:
            - {canonical: insomnia, label: poor sleep, body_part: null, severity: unknown,
               duration: null, onset: last night, status: new, raw_quote: sleep well}
            - {canonical: insomnia, label: 没睡好, body_part: null, severity: unknown,
               duration: null, onset: last night, status: new, raw_quote: 没睡好}
      - match: ["knee", "膝盖"]
        result:
          symptoms:
            - {canonical: joint_pain, label: knee pain, body_part: knee, severity: unknown,
               duration: null, onset: null, status: ongoing, raw_quote: knee}
            - {canonical: joint_pain, label: 膝盖疼, body_part: knee, severity: unknown,
               duration: null, onset: null, status: ongoing, raw_quote: 膝盖}
  # daily_digest: rules match the last paragraph of the notes, which is the alerts block.
  daily_digest:
    default:
      summary: "Maggie chatted for a little while and seemed like her usual self."
      mood_score: 3
      topics: [chat]
    rules:
      - match: ["Chest pain", "Shortness of breath"]
        result:
          summary: "Maggie was in good spirits and chatted about her garden. She mentioned feeling dizzy in the mornings and, later, chest tightness with trouble breathing, which raised an emergency alert. Please check in with her today."
          mood_score: 2
          topics: [garden, sleep, dizziness]
      - match: ["Fall detected"]
        result:
          summary: "A fall was detected at home today. Maggie chatted as usual otherwise."
          mood_score: 2
          topics: [fall]

  # memory_extraction: "$current_message_id" is replaced with the id of the utterance.
  memory_extraction:
    default: {items: [], privacy_request: {requested: false, covers_message_ids: []}}
    rules:
      - match: ["between us"]
        result:
          items:
            - {kind: person, subject: Linda, text: her friend Linda got bad news from her doctor,
               due_in_days: null, raw_quote: Linda}
          privacy_request: {requested: true, covers_message_ids: [$current_message_id]}
      - match: ["别告诉"]
        result:
          items: []
          privacy_request: {requested: true, covers_message_ids: [$current_message_id]}
      - match: ["orchid"]
        result:
          items:
            - {kind: follow_up, subject: orchid, text: planning to repot her orchid this week,
               due_in_days: 3, raw_quote: orchid}
          privacy_request: {requested: false, covers_message_ids: []}
      - match: ["Rosa"]
        result:
          items:
            - {kind: person, subject: Rosa, text: her neighbor Rosa, due_in_days: null,
               raw_quote: Rosa}
          privacy_request: {requested: false, covers_message_ids: []}
      # Reminder answers. "$open_reminder_id" becomes the id of the reminder raised today;
      # with no reminder open the ack is dropped, so these rules are safe to match broadly.
      - match: ["took it", "already took", "吃过了", "吃了"]
        result:
          items: []
          privacy_request: {requested: false, covers_message_ids: []}
          reminder_acks: [{reminder_id: $open_reminder_id, status: confirmed}]
      - match: ["not yet", "还没"]
        result:
          items: []
          privacy_request: {requested: false, covers_message_ids: []}
          reminder_acks: [{reminder_id: $open_reminder_id, status: declined}]

transcribe:
  default: "Good morning! I'm doing okay today."

tts:
  # false -> /api/tts answers 204 and the elder page speaks with the browser's built-in voice
  # (audible in an offline demo, instead of the mock's silent mp3).
  available: false
