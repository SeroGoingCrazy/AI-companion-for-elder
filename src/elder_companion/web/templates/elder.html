<!doctype html>
<html lang="{{ lang }}" dir="{{ t.dir }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F2EA">
  <title>{{ companion_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Fraunces:opsz,wght@9..144,700&display=swap">
  <link rel="stylesheet" href="/static/elder.css">
  <link rel="manifest" href="/manifest-elder.webmanifest">
  <meta name="apple-mobile-web-app-title" content="{{ companion_name }}">
  <!-- iOS ignores the manifest: these three meta tags are what make "Add to Home Screen"
       open full screen, and it only ever uses apple-touch-icon.png. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
</head>
<body class="elder" data-state="idle">
  <main class="elder-app">
    <header class="elder-header">
      <svg class="avatar" viewBox="0 0 48 48" aria-hidden="true">
        <circle class="disc" cx="24" cy="24" r="10.5" />
        <g class="ray" stroke-width="3.5" stroke-linecap="round">
          <line x1="24" y1="4" x2="24" y2="9" /><line x1="24" y1="39" x2="24" y2="44" />
          <line x1="4" y1="24" x2="9" y2="24" /><line x1="39" y1="24" x2="44" y2="24" />
          <line x1="9.9" y1="9.9" x2="13.4" y2="13.4" /><line x1="34.6" y1="34.6" x2="38.1" y2="38.1" />
          <line x1="9.9" y1="38.1" x2="13.4" y2="34.6" /><line x1="34.6" y1="13.4" x2="38.1" y2="9.9" />
        </g>
      </svg>
      <div>
        <h1>{{ companion_name }}</h1>
        <p class="subtitle">{{ t.elder.subtitle.format(nickname=nickname) }}</p>
      </div>
      <div id="voice-switch" class="voice-switch" role="group" aria-label="{{ t.elder.voice_group.format(companion=companion_name) }}">
        <button type="button" data-voice="female" aria-pressed="true">{{ t.elder.voice_female }}</button>
        <button type="button" data-voice="male" aria-pressed="false">{{ t.elder.voice_male }}</button>
      </div>
      <button id="lang-btn" class="lang-switch" type="button" data-next="{{ other_lang }}">{{ t.switch_to }}</button>
    </header>

    <section id="start-screen" class="start">
      <p class="start-greeting">{{ t.elder.greeting.format(nickname=nickname) }}</p>
      <button id="start-btn" class="start-btn" type="button">{{ t.elder.start }}</button>
    </section>

    <section id="chat-screen" class="chat" hidden>
      <div id="conversation" class="conversation" aria-live="polite"></div>

      <p id="status" class="status" role="status"></p>

      <button id="mic-btn" class="mic" type="button" aria-label="{{ t.elder.hold_to_talk }}" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="2.5" width="6" height="12" rx="3" />
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <span id="mic-label">{{ t.elder.press_and_speak }}</span>
      </button>
      <p class="mic-hint">{{ t.elder.release_to_send }}</p>

      <details class="type-instead">
        <summary>{{ t.elder.type_instead }}</summary>
        <form id="text-form" class="text-form" autocomplete="off">
          <label for="text-input" class="visually-hidden">{{ t.elder.your_message }}</label>
          <input id="text-input" type="text" maxlength="2000" placeholder="{{ t.elder.placeholder }}">
          <button type="submit">{{ t.elder.send }}</button>
        </form>
      </details>
    </section>

    <footer class="disclaimer">{{ t.elder.disclaimer.format(companion=companion_name) }}</footer>
  </main>

  <script>window.APP_CONFIG = {{ app_config | tojson }};</script>
  <script src="/static/lang.js" defer></script>
  <script src="/static/elder.js" defer></script>
  <script src="/static/pwa.js" defer></script>
</body>
</html>
