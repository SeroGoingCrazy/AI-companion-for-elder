[project]
name = "ai-companion-for-elder"
version = "0.1.0"
description = "AI companion agent for older adults, with a family-side care dashboard and fall detection (fall-mcp)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "openai>=1.60",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "mcp>=1.9",
]

[project.scripts]
elder-web = "elder_companion.web.app:main"

[project.optional-dependencies]
vision = [
    "ultralytics>=8.3",
    "opencv-python>=4.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elder_companion", "src/fall_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: offline component tests (mock LLM)",
    "integration: FastAPI TestClient / in-process MCP, offline",
    "llm: requires a real OPENAI_API_KEY",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
